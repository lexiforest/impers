name: Test on Ubuntu

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "bugfix/**"
      - "feature/**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: node-diagnostic-reports
          path: reports/
          if-no-files-found: ignore

  live-fingerprints:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Verify live fingerprint API secret
        env:
          IMPERSONATE_API_KEY: ${{ secrets.IMPERSONATE_API_KEY }}
        run: |
          if [ -z "$IMPERSONATE_API_KEY" ]; then
            echo "::error::Repository secret IMPERSONATE_API_KEY is not configured"
            exit 1
          fi
      - run: npm run test:live
        env:
          IMPERSONATE_API_KEY: ${{ secrets.IMPERSONATE_API_KEY }}
